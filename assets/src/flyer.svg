<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Classified: hire a developer</title>
  <desc id="d">Fresh B.Tech IT graduate, class of 2026, Tamil Nadu, India. LLM agents and RAG, YOLOv8 computer vision, Next.js and FastAPI, CI quality gates. Tear off a tab below to get in touch.</desc>
  <!-- Built by scripts/build-static.mjs from assets/src/flyer.svg. Fonts: Playfair Display, IBM Plex Mono, Caveat, all SIL OFL 1.1, embedded unmodified. -->

  <defs>
    <style>
      @font-face { font-family: 'PF'; font-weight: 900; src: url({{FONT_PF900}}) format('woff2'); }
      @font-face { font-family: 'PF'; font-weight: 400; font-style: italic; src: url({{FONT_PF400I}}) format('woff2'); }
      @font-face { font-family: 'PM'; font-weight: 500; src: url({{FONT_PM500}}) format('woff2'); }
      @font-face { font-family: 'CV'; font-weight: 700; src: url({{FONT_CAV}}) format('woff2'); }

      .serif { font-family: 'PF', Georgia, serif; }
      .mono  { font-family: 'PM', 'Courier New', monospace; font-weight: 500; }
      .hand  { font-family: 'CV', 'Comic Sans MS', cursive; font-weight: 700; }
      .ink   { fill: #16130F; }

      .tick    { stroke-dasharray: 24; animation: tick .35s ease-out both; }
      .t1 { animation-delay: .6s; } .t2 { animation-delay: .85s; } .t3 { animation-delay: 1.1s; } .t4 { animation-delay: 1.35s; }
      .note    { animation: pop .5s cubic-bezier(.3,1.5,.5,1) 1.7s both; transform-box: fill-box; transform-origin: center; }
      .arrow   { stroke-dasharray: 90; animation: tick .6s ease-out 2.1s both; }
      .snip    { animation: snip 7s ease-in-out 2.4s infinite; }
      .blade   { transform-box: fill-box; transform-origin: 0 50%; animation: chop .35s ease-in-out infinite alternate; }
      .blade2  { transform-box: fill-box; transform-origin: 0 50%; animation: chop2 .35s ease-in-out infinite alternate; }

      @keyframes tick  { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
      @keyframes pop   { from { opacity: 0; transform: scale(.6) rotate(-5deg); } to { opacity: 1; transform: rotate(-5deg); } }
      @keyframes snip  { 0% { transform: translateX(0); } 45%, 55% { transform: translateX(560px); } 100% { transform: translateX(0); } }
      @keyframes chop  { from { transform: rotate(-12deg); } to { transform: rotate(0deg); } }
      @keyframes chop2 { from { transform: rotate(12deg); } to { transform: rotate(0deg); } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .note { transform: rotate(-5deg); }
      }
    </style>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
    </filter>
    <radialGradient id="pinShine" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#FF8A80"/>
      <stop offset=".45" stop-color="#D32F2F"/>
      <stop offset="1" stop-color="#8E1B1B"/>
    </radialGradient>
  </defs>

  <!-- paper -->
  <rect x="4" width="632" height="330" fill="#FBF6EA"/>
  <rect x="4" width="632" height="330" filter="url(#grain)"/>

  <!-- pushpin -->
  <ellipse cx="326" cy="27" rx="11" ry="4" fill="#000" opacity=".18"/>
  <circle cx="320" cy="20" r="11" fill="url(#pinShine)"/>
  <circle cx="316" cy="16" r="3" fill="#fff" opacity=".7"/>

  <text class="mono ink" x="40" y="26" font-size="11" letter-spacing="2">CLASSIFIED · NO. 2026</text>
  <text class="mono ink" x="600" y="26" font-size="11" letter-spacing="2" text-anchor="end">TAMIL NADU, INDIA</text>

  <text class="serif ink" x="320" y="88" font-size="54" font-weight="900" text-anchor="middle" letter-spacing="1">HIRE A DEVELOPER</text>
  <text class="serif ink" x="320" y="120" font-size="19" font-style="italic" text-anchor="middle">Fresh B.Tech IT graduate, class of 2026. Ships, tests, repeats.</text>

  <rect class="ink" x="40" y="140" width="560" height="1" opacity=".5"/>

  <!-- what's included -->
  <g class="mono ink" font-size="15">
    <rect x="62" y="160" width="16" height="16" fill="none" stroke="#16130F" stroke-width="1.5"/>
    <text x="90" y="174">LLM agents &amp; RAG</text>
    <rect x="352" y="160" width="16" height="16" fill="none" stroke="#16130F" stroke-width="1.5"/>
    <text x="380" y="174">YOLOv8 computer vision</text>
    <rect x="62" y="196" width="16" height="16" fill="none" stroke="#16130F" stroke-width="1.5"/>
    <text x="90" y="210">Next.js · FastAPI · Flask</text>
    <rect x="352" y="196" width="16" height="16" fill="none" stroke="#16130F" stroke-width="1.5"/>
    <text x="380" y="210">Tests &amp; CI quality gates</text>
  </g>
  <g fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path class="tick t1" d="M63 166l6 8 12-15"/>
    <path class="tick t2" d="M353 166l6 8 12-15"/>
    <path class="tick t3" d="M63 202l6 8 12-15"/>
    <path class="tick t4" d="M353 202l6 8 12-15"/>
  </g>

  <text class="serif ink" x="40" y="258" font-size="16" font-style="italic">No experience with giving up. Powered by filter coffee.</text>

  <!-- handwritten note -->
  <g class="note">
    <text class="hand" x="458" y="262" font-size="30" fill="#C62828">tear one off!</text>
  </g>
  <path class="arrow" d="M540 272c10 12 8 22-4 32m4 0l-6 0 2-7" fill="none" stroke="#C62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- perforation and scissors -->
  <path d="M8 322H632" stroke="#16130F" stroke-width="1.2" stroke-dasharray="6 5" opacity=".55"/>
  <g class="snip">
    <g transform="translate(14 322)" fill="none" stroke="#16130F" stroke-width="1.6">
      <g class="blade"><circle cx="-4" cy="-6" r="4"/><path d="M0 -5L16 1"/></g>
      <g class="blade2"><circle cx="-4" cy="6" r="4"/><path d="M0 5L16 -1"/></g>
    </g>
  </g>
</svg>
