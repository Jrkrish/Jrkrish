<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 150" width="128" height="150" role="img" aria-labelledby="t">
  <title id="t">{{LABEL}}: {{DETAIL}}</title>
  <!-- Built by scripts/build-static.mjs from assets/src/tab.svg. Fonts: Playfair Display, IBM Plex Mono, SIL OFL 1.1, embedded unmodified. -->

  <defs>
    <style>
      @font-face { font-family: 'PF'; font-weight: 700; src: url({{FONT_PF700}}) format('woff2'); }
      @font-face { font-family: 'PM'; font-weight: 500; src: url({{FONT_PM500}}) format('woff2'); }
      .serif { font-family: 'PF', Georgia, serif; font-weight: 700; }
      .mono  { font-family: 'PM', 'Courier New', monospace; font-weight: 500; }

      .sway { transform-origin: 64px 0; animation: sway {{SWAY}}s ease-in-out {{DELAY}}s infinite alternate; }
      @keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
    </filter>
    <linearGradient id="curl" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".75" stop-color="#7A5A2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A5A2B" stop-opacity=".14"/>
    </linearGradient>
  </defs>

  <g class="sway">
    <rect x="8" y="0" width="112" height="146" fill="#FBF6EA"/>
    <rect x="8" y="0" width="112" height="146" filter="url(#grain)"/>
    <rect x="8" y="0" width="112" height="146" fill="url(#curl)"/>

    <!-- link mark -->
    <path d="M58 6h11v11M69 6L57 18" fill="none" stroke="#C62828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(64 142) rotate(-90)">
      <text class="serif" x="0" y="-6" font-size="19" fill="#16130F">{{LABEL}}</text>
      <text class="mono" x="0" y="14" font-size="9.5" fill="#16130F" opacity=".75">{{DETAIL}}</text>
    </g>
  </g>
</svg>
