name: Print the daily edition

# Builds the pages that change every day (the front page and "By the numbers",
# with the contribution snake as its puzzle) and publishes them to the
# `output` branch, which the README loads them from.

on:
  schedule:
    - cron: "35 18 * * *" # 00:05 IST, so the date turns over at midnight in India
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # svg-only runs as a plain Node action, so dist/ stays writable for the next step.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake.svg

      - name: Build front page and numbers
        run: node scripts/build-daily.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
